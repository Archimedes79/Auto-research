<text x="390.0" y="646" font-size="20" font-weight="bold" text-anchor="middle" fill="#1d2330">Auswertung</text>
<text x="390.0" y="675" font-size="19" text-anchor="middle" fill="#1d2330">außerhalb des Kopfes: p >= 0.5</text>
<text x="390.0" y="738" font-size="17" text-anchor="middle" fill="#1d2330">33,738 Parameter (21,130 nur Geometrie), keine Self-Attention.</text>
<text x="390.0" y="762" font-size="17" text-anchor="middle" fill="#1d2330">Kopf ohne Karte (z): jede Route ungültig, nur der None-Schlüssel.</text>
