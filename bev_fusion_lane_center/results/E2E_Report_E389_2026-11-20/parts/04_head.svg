<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 790" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker></defs>
