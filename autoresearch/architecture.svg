<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1588 850" width="1588" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>autoresearch: design, files, execution</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1588" height="850" fill="#ffffff"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">autoresearch: design, files, execution</text>
<text x="24" y="50" font-size="12" fill="#475569">People and agents design what to do and write it down as plain files; code reads the files, runs them and writes its records back. Between the layers sit gates that can refuse; at the end the temporary data is cleaned up.</text>
<rect x="32.0" y="73.0" width="1512.0" height="98.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="1228.0" y="105.0" font-size="11" fill="#475569">The edit layer. METHOD.md cuts one cycle into P0</text>
<text x="1228.0" y="120.0" font-size="11" fill="#475569">frame, P1 research, P2 hypotheses + plan, P3 loop and</text>
<text x="1228.0" y="135.0" font-size="11" fill="#475569">P4 close, each ended by a gate. What is the person&#x27;s</text>
<text x="1228.0" y="150.0" font-size="11" fill="#475569">goes through DECISIONS.md.</text>
<rect x="32.0" y="273.0" width="1512.0" height="98.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="1228.0" y="305.0" font-size="11" fill="#475569">The design layer writes them, the execution layer</text>
<text x="1228.0" y="320.0" font-size="11" fill="#475569">reads them and writes its records back; nothing else</text>
<text x="1228.0" y="335.0" font-size="11" fill="#475569">passes between the layers. Both layers read the</text>
<text x="1228.0" y="350.0" font-size="11" fill="#475569">records.</text>
<rect x="32.0" y="473.0" width="1512.0" height="98.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
<text x="1228.0" y="505.0" font-size="11" fill="#475569">Standard-library python with selftests. The launcher</text>
<text x="1228.0" y="520.0" font-size="11" fill="#475569">runs what the schedule says, the suites judge it, the</text>
<text x="1228.0" y="535.0" font-size="11" fill="#475569">written rule decides, the validators keep the files</text>
<text x="1228.0" y="550.0" font-size="11" fill="#475569">honest.</text>
