<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 670" width="968" height="670" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>GtGenerator: one class, one code block per problem, one output per problem</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="968" height="670" fill="#ffffff"/>
<text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">GtGenerator: one class, one code block per problem, one output per problem</text>
<text x="24" y="50" font-size="12" fill="#475569">The command line calls only the class; the class calls the code of the problem asked for. Each problem keeps its difficult code and its own output together.</text>
