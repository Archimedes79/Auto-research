<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="640" fill="#fbfaf7"/>
  <text x="390" y="22" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2330">The end-to-end token champion: grid -> nodes -> pruning -> self-attention (the wiring) -> past -> map -> node types</text>
  <text x="390" y="38" font-size="10.5" text-anchor="middle" fill="#5b6475">solid = built and measured (stage S1, E365) | dashed = planned stages, PENDING | amber outline = a named hard step on the output or a named budget</text>

  <!-- input -->
  <rect x="230" y="52" width="320" height="42" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
  <text x="390" y="70" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Frozen GaussianCaR camera + radar BEV features</text>
  <text x="390" y="85" font-size="10.5" text-anchor="middle" fill="#1d2330">39 x 200 x 200, cached (one keyframe in)</text>
  <line x1="390" y1="94" x2="390" y2="112" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- B' -->
  <rect x="190" y="114" width="400" height="62" rx="6" fill="#e3f1e6" stroke="#2f6b3c" stroke-width="1.6"/>
  <text x="390" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">B': the frozen lane head B + soft Matrix-NMS layer (cached)</text>
  <text x="390" y="147" font-size="10.5" text-anchor="middle" fill="#1d2330">pyramid + node head on the 2 m grid: per cell existence e, position, heading,</text>
  <text x="390" y="161" font-size="10.5" text-anchor="middle" fill="#1d2330">8 flag logits, a 64-d node token; no gradient reaches it (frozen, cached)</text>
  <line x1="390" y1="176" x2="390" y2="196" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- top-K -->
  <rect x="215" y="198" width="350" height="40" rx="6" fill="#fff6dc" stroke="#b07a00" stroke-width="2.2"/>
  <text x="390" y="214" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Tokens = predicted nodes: top-K 512 by existence</text>
  <text x="390" y="230" font-size="10.5" text-anchor="middle" fill="#1d2330">HARD STEP, a named compute budget: no gradient goes through it</text>
  <line x1="390" y1="238" x2="390" y2="258" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- embedding + self-attention -->
  <rect x="150" y="260" width="480" height="104" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
  <text x="390" y="278" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Embedding (d = 64) + 3 self-attention layers (4 heads, FFN 128)</text>
  <text x="390" y="294" font-size="10.5" text-anchor="middle" fill="#1d2330">token + Fourier(position), heading, e, flags -> x0</text>
  <text x="390" y="309" font-size="10.5" text-anchor="middle" fill="#1d2330">attention logit = q.k / 4 + bias(13 relative-geometry features of the pair) + log(w_j)</text>
  <text x="390" y="324" font-size="10.5" text-anchor="middle" fill="#1d2330">SOFT PRUNING: the existence weight w_j biases every key (no token is dropped inside)</text>
  <text x="390" y="339" font-size="10.5" text-anchor="middle" fill="#1d2330">first 1000 steps and layer 1: w = sigmoid(e) of B'; afterwards w = 1 - p_none of the head itself</text>
  <text x="390" y="354" font-size="10.5" text-anchor="middle" fill="#1d2330">gradient reaches the head only (not B')</text>
  <line x1="390" y1="364" x2="390" y2="384" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- planned S2 / S3 (dashed) -->
  <rect x="640" y="260" width="130" height="104" rx="6" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="705" y="280" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d2330">S2 (PENDING)</text>
  <text x="705" y="295" font-size="10" text-anchor="middle" fill="#1d2330">cross-attention</text>
  <text x="705" y="309" font-size="10" text-anchor="middle" fill="#1d2330">to the past: tokens</text>
  <text x="705" y="323" font-size="10" text-anchor="middle" fill="#1d2330">of the previous</text>
  <text x="705" y="337" font-size="10" text-anchor="middle" fill="#1d2330">keyframe, ego-warped,</text>
  <text x="705" y="351" font-size="10" text-anchor="middle" fill="#1d2330">one frame per step</text>
  <line x1="640" y1="312" x2="632" y2="312" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <rect x="10" y="260" width="130" height="104" rx="6" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="75" y="280" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d2330">S3 (PENDING)</text>
  <text x="75" y="295" font-size="10" text-anchor="middle" fill="#1d2330">cross-attention</text>
  <text x="75" y="309" font-size="10" text-anchor="middle" fill="#1d2330">to the map: the</text>
  <text x="75" y="323" font-size="10" text-anchor="middle" fill="#1d2330">road-level (SD) map</text>
  <text x="75" y="337" font-size="10" text-anchor="middle" fill="#1d2330">as keys and values</text>
  <text x="75" y="351" font-size="10" text-anchor="middle" fill="#1d2330">for the node tokens</text>
  <line x1="140" y1="312" x2="148" y2="312" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <!-- wiring layer -->
  <rect x="120" y="386" width="540" height="112" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="2"/>
  <text x="390" y="404" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">The wiring = attention weights of the last layer (2 heads: short links, long links)</text>
  <text x="390" y="420" font-size="10.5" text-anchor="middle" fill="#1d2330">per-source SOFTMAX over {the allowed destination tokens, one learned "none" slot}</text>
  <text x="390" y="435" font-size="10.5" text-anchor="middle" fill="#1d2330">short = chord up to 8 m, long = chord over 8 m (junction connectors); the none slot sees the whole candidate set</text>
  <text x="390" y="450" font-size="10.5" text-anchor="middle" fill="#1d2330">two handle scales per pair (a small MLP) give the connector curve</text>
  <rect x="150" y="458" width="480" height="32" rx="4" fill="#fff6dc" stroke="#b07a00" stroke-width="1.8"/>
  <text x="390" y="472" font-size="10.5" text-anchor="middle" fill="#1d2330">HARD STEP: the allowed-pair gate (pair_geometry: turn angle, minimum and forward chord)</text>
  <text x="390" y="485" font-size="10.5" text-anchor="middle" fill="#1d2330">in front of the softmax: an index limit of the attention, named</text>

  <!-- node type -->
  <rect x="120" y="512" width="270" height="52" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
  <text x="255" y="530" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d2330">Node type: softmax over 7</text>
  <text x="255" y="545" font-size="10" text-anchor="middle" fill="#1d2330">none / lane point / fork / merge / entry / exit / boundary</text>
  <text x="255" y="558" font-size="10" text-anchor="middle" fill="#1d2330">p_none = the head's own pruning weight</text>
  <line x1="390" y1="498" x2="390" y2="510" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="255" y1="498" x2="255" y2="510" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- read-out -->
  <rect x="410" y="512" width="250" height="52" rx="6" fill="#fff6dc" stroke="#b07a00" stroke-width="2.2"/>
  <text x="535" y="530" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d2330">Read-out on the output only</text>
  <text x="535" y="545" font-size="10" text-anchor="middle" fill="#1d2330">keep node: p_none &lt; 0.5; keep link: p &gt;= 0.3</text>
  <text x="535" y="558" font-size="10" text-anchor="middle" fill="#1d2330">and p &gt;= p(none); chains cut at forks / merges</text>
  <line x1="390" y1="498" x2="520" y2="510" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="390" y1="538" x2="410" y2="538" stroke="#444" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- output -->
  <rect x="250" y="580" width="280" height="40" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <text x="390" y="597" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Delivered lane-centre graph</text>
  <text x="390" y="612" font-size="10.5" text-anchor="middle" fill="#1d2330">lane pieces, forks, merges, junction connectors (S1: PENDING for the champion)</text>
  <line x1="535" y1="564" x2="470" y2="578" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- S4 -->
  <rect x="640" y="400" width="130" height="86" rx="6" fill="none" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="705" y="420" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d2330">S4 (PENDING)</text>
  <text x="705" y="435" font-size="10" text-anchor="middle" fill="#1d2330">joint fine-tune:</text>
  <text x="705" y="449" font-size="10" text-anchor="middle" fill="#1d2330">a loss on the output</text>
  <text x="705" y="463" font-size="10" text-anchor="middle" fill="#1d2330">also reaches B'</text>
  <text x="705" y="477" font-size="10" text-anchor="middle" fill="#1d2330">(not built)</text>

  <text x="12" y="596" font-size="10" fill="#5b6475">Not in the system: keypoint peaks + top-K 32,</text>
  <text x="12" y="609" font-size="10" fill="#5b6475">snap, attachment, wiring rule, close-node step.</text>
</svg>
