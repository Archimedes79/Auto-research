<text x="24" y="30" font-size="19" font-weight="700" fill="#0f172a">autogt: command line, class interface, foundation data, generators, data and version key</text>
<text x="24" y="50" font-size="12" fill="#475569">The command line calls only the class AutoGT. Left to right is the way of the data: raw nuScenes, the hashed generators, stored data and the GT key. Generated from architecture.json</text>
