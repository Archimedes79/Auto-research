<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker></defs>
<rect x="0" y="0" width="780" height="700" fill="#fbfaf7"/>
<text x="390" y="22" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d2330">E389: the route-association head on the cached tokens of the champion</text>
<text x="390" y="38" font-size="10.5" text-anchor="middle" fill="#5b6475">blue = learned | green = given (frozen tokens, SD route) | amber outline = a named read-out step | grey dashed = training only | parameters read from RouteHead</text>
<rect x="30" y="56" width="330" height="68" rx="6" fill="#e3f1e6" stroke="#2f6b3c" stroke-width="1.6"/>
<text x="195.0" y="73" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Tokens of the frozen lane head B' (cached, K = 512)</text>
<text x="195.0" y="88" font-size="10.5" text-anchor="middle" fill="#1d2330">node token tok (64-d), position, heading,</text>
<text x="195.0" y="102" font-size="10.5" text-anchor="middle" fill="#1d2330">existence logit e, 8 flag logits per token</text>
<text x="195.0" y="116" font-size="10.5" text-anchor="middle" fill="#1d2330">no gradient reaches B' (the head is not in stage 2)</text>
<line x1="195" y1="124" x2="195" y2="142" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="142" width="330" height="84" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
<text x="195.0" y="159" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Own features of every token</text>
<text x="195.0" y="174" font-size="10.5" text-anchor="middle" fill="#1d2330">tok -> Linear + LayerNorm (64): 4,288 parameters</text>
<text x="195.0" y="188" font-size="10.5" text-anchor="middle" fill="#1d2330">geometry MLP (position in m, heading, sigmoid(e), flags): 1,568</text>
<text x="195.0" y="202" font-size="10.5" text-anchor="middle" fill="#1d2330">concat x (96-d) -> LayerNorm + Linear q (4 heads x 16): 6,400</text>
<text x="195.0" y="216" font-size="10.5" text-anchor="middle" fill="#1d2330">arm z and the geometry-only control drop tok</text>
<rect x="420" y="56" width="330" height="68" rx="6" fill="#e3f1e6" stroke="#2f6b3c" stroke-width="1.6"/>
<text x="585.0" y="73" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">SD route tokens (ADASIS-like map, simulated)</text>
<text x="585.0" y="88" font-size="10.5" text-anchor="middle" fill="#1d2330">up to 160 samples every 2 m, +-50 m: position, direction,</text>
<text x="585.0" y="102" font-size="10.5" text-anchor="middle" fill="#1d2330">lane count, valid; the lane choice is lost;</text>
<text x="585.0" y="116" font-size="10.5" text-anchor="middle" fill="#1d2330">map errors: shift 1 - 2 m, yaw, sparsified polyline</text>
<line x1="585" y1="124" x2="585" y2="142" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="420" y="142" width="330" height="84" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
<text x="585.0" y="159" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Route keys</text>
<text x="585.0" y="174" font-size="10.5" text-anchor="middle" fill="#1d2330">[position, direction, one-hot lane count] -> Linear + LayerNorm: 832</text>
<text x="585.0" y="188" font-size="10.5" text-anchor="middle" fill="#1d2330">keys and values (Linear 64 -> 128): 8,320</text>
<text x="585.0" y="202" font-size="10.5" text-anchor="middle" fill="#1d2330">one learned none key per head (k, v, bias): 132</text>
<text x="585.0" y="216" font-size="10.5" text-anchor="middle" fill="#1d2330">a frame without a map: the none key only (arm z)</text>
<rect x="215" y="252" width="350" height="62" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
<text x="390.0" y="269" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Pair features (token i, route key j), in metres</text>
<text x="390.0" y="284" font-size="10.5" text-anchor="middle" fill="#1d2330">turn cos / sin, offset along / across the token heading and the</text>
<text x="390.0" y="298" font-size="10.5" text-anchor="middle" fill="#1d2330">route direction, distance, lane count: 8 features; bias MLP (8 -> 32 -> 4): 420</text>
<line x1="195" y1="226" x2="260" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="585" y1="226" x2="520" y2="252" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="30" y="344" width="340" height="88" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
<text x="200.0" y="361" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Attention A (learned, 4 heads)</text>
<text x="200.0" y="376" font-size="10.5" text-anchor="middle" fill="#1d2330">softmax over {valid route keys} + {none key}:</text>
<text x="200.0" y="390" font-size="10.5" text-anchor="middle" fill="#1d2330">logit = q.k / 4 + bias(pair features)</text>
<text x="200.0" y="404" font-size="10.5" text-anchor="middle" fill="#1d2330">-> attended values, attention mass on real keys per head,</text>
<text x="200.0" y="418" font-size="10.5" text-anchor="middle" fill="#1d2330">pair features pooled by A</text>
<rect x="410" y="344" width="340" height="88" rx="6" fill="#fff6dc" stroke="#b07a00" stroke-width="2.2"/>
<text x="580.0" y="361" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Attention B (sharp, fixed, no parameter)</text>
<text x="580.0" y="376" font-size="10.5" text-anchor="middle" fill="#1d2330">soft nearest key: softmax of -distance / 0.3 m over the valid keys</text>
<text x="580.0" y="390" font-size="10.5" text-anchor="middle" fill="#1d2330">(no hard selection) -> the metre-scale features of the</text>
<text x="580.0" y="404" font-size="10.5" text-anchor="middle" fill="#1d2330">nearest key: offset across the route = the registration</text>
<line x1="195" y1="314" x2="200" y2="344" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="390" y1="314" x2="560" y2="344" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="195" y1="226" x2="120" y2="344" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="200" y1="432" x2="330" y2="470" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="580" y1="432" x2="450" y2="470" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="190" y="472" width="400" height="74" rx="6" fill="#e9eef7" stroke="#31507f" stroke-width="1.6"/>
<text x="390.0" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Output MLP: [x, attended, mass, pooled A, pooled B, any-map flag] (181)</text>
<text x="390.0" y="504" font-size="10.5" text-anchor="middle" fill="#1d2330">-> 64 -> 2 logits: 11,778 parameters</text>
<text x="390.0" y="518" font-size="10.5" text-anchor="middle" fill="#1d2330">road: the token lies on the carriageway of the route</text>
<text x="390.0" y="532" font-size="10.5" text-anchor="middle" fill="#1d2330">lane: it lies on the lane the vehicle will drive</text>
<line x1="390" y1="546" x2="390" y2="570" stroke="#444" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="190" y="572" width="400" height="62" rx="6" fill="#fff6dc" stroke="#b07a00" stroke-width="2.2"/>
<text x="390.0" y="589" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Read-out on the delivered tokens of the champion</text>
<text x="390.0" y="604" font-size="10.5" text-anchor="middle" fill="#1d2330">p_route >= 0.5 per delivered token (the E373 head at the D115 decode)</text>
<text x="390.0" y="618" font-size="10.5" text-anchor="middle" fill="#1d2330">the scored unit is the covered GT node; no token is dropped by this head</text>
<rect x="610" y="472" width="150" height="74" rx="6" fill="#f1f1f1" stroke="#777" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="685.0" y="489" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d2330">Training only</text>
<text x="685.0" y="504" font-size="10.5" text-anchor="middle" fill="#1d2330">BCE of both logits on the</text>
<text x="685.0" y="518" font-size="10.5" text-anchor="middle" fill="#1d2330">labelled tokens; GT route</text>
<text x="685.0" y="532" font-size="10.5" text-anchor="middle" fill="#1d2330">labels (tier 1), never an input</text>
<line x1="610" y1="509" x2="590" y2="509" stroke="#444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="390" y="662" font-size="11" text-anchor="middle" fill="#1d2330">33,738 parameters with tok (full), 21,130 geometry-only; no self-attention among the tokens: a token reads only its own row and the route</text>
<text x="390" y="680" font-size="11" text-anchor="middle" fill="#5b6475">Reference arm z: the same head with every route key invalid (the matched no-map head). Source: training/grid/jroute.py</text>
</svg>
